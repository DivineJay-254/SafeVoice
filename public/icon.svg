<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background with safe zone padding -->
  <rect width="512" height="512" rx="112" fill="url(#brandGrad)"/>
  
  <!-- Outer Shield Emblem -->
  <g filter="url(#shadow)">
    <path d="M 256 70 
             C 340 70 400 95 400 95 
             C 400 240 330 365 256 425 
             C 182 365 112 240 112 95 
             C 112 95 172 70 256 70 Z" 
          fill="#ffffff" 
          opacity="0.95"/>
    
    <!-- Inner Heart + Hand / Protection Glyph -->
    <path d="M 256 160 
             C 285 125 340 130 355 175 
             C 370 220 335 270 256 335 
             C 177 270 142 220 157 175 
             C 172 130 227 125 256 160 Z" 
          fill="url(#brandGrad)"/>
    
    <!-- Lifeline / Star Symbol in center -->
    <circle cx="256" cy="225" r="22" fill="#ffffff"/>
  </g>
</svg>
